    <h2>Enquiry</h2>

<form>
  <label for="name">Name:</label><br>
  <input type="text" id="name" name="name" required placeholder="Your Name"><br><br>

  <label for="surname">Surname:</label><br>
  <input type="text" id="surname" name="surname" required placeholder="Your Surname"><br><br>

  <label for="email">Email Address:</label><br>
  <!-- Label for email -->
  <input type="email" id="email" name="email" required placeholder="name@example.com"><br><br>

  <label for="phonenumber">Phone Number:</label><br>
  <input type="text" id="phonenumber" name="phonenumber" required placeholder="Phone Number"><br><br>

  <label for="enquiryType">Enquiry Type:</label><br>
  <select id="enquiryType" name="enquiryType">
    <option>Select an option</option>
    <OPTION>Combo</OPTION>
    <option>Standalone</option>
  </select><br><br>

  <label for="message">Your Message:</label><br>
  <textarea id="message" name="message" placeholder="Type your enquiry here..." rows="5" cols="40"></textarea><br><br>

  <button type="submit">Submit Enquiry</button><br>
